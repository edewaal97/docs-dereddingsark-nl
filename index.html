<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Handleidingen voor De Reddingsark</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Handleidingen voor beamerdienst, geluid en verlichting bij De Reddingsark.">
  <style>
    /* ========== CSS RESET ==========  */
    /* makes sizing simpler */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    /* remove default spacing */
    /* force styling of type through styling, rather than elements */
    * {
      margin: 0;
      padding: 0;
      font: inherit;
    }

    /* dark mode user-agent-styles */
    /* improves punctuation in supported browsers */
    html {
      color-scheme: dark light;
      hanging-punctuation: first last;
    }

    /* min body height */
    body {
      min-height: 100svh;
    }

    /* responsive images/videos */
    img,
    picture,
    svg,
    video {
      display: block;
      max-width: 100%;
    }

    /* Improved heading in supported browsers */
    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      text-wrap: balance;
    }

    /* improve readability with max-width on paragraphs and lists */
    /* prevent orphans in supported browsers */
    p,
    li {
      max-width: var(--p-max-width, 65ch);
      text-wrap: pretty;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
    /* ========== END OF RESET ========== */

    :root {
      --ink:light-dark(#20352f, #e0ebe5);
      --muted:light-dark(#60746d, #9aafa5);
      --accent:light-dark(#087f68, #35c6a2);
      --bg:light-dark(#f4faf6, #111c18);
      --card:light-dark(#fff, #1b2a24);
      --cardshadow:light-dark(#1d49300f, #00000030);
      --line:light-dark(#dbe9e0, #30443a);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      background:var(--bg);
      color:var(--ink);
    }
    
    a {
      text-decoration-style:dotted;
      text-decoration-thickness: 1px;
    }
    
    .card {
      text-decoration: none;
    }

    a:focus-visible {
      outline: .1875rem solid currentColor;
      outline-offset: .25rem;
    }

    main {
      width:min(100% - 2rem,60rem);
      margin:auto;
      padding:clamp(2rem,7vw,5rem) 0 2rem;
    }

    .top {
      display:flex;
      align-items:center;
      gap:.75rem;
      color:var(--accent);
      font-weight:bold;
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        color: oklch( from var(--accent) calc(l - 0.1) c h);
      }
    }

    h1 {
      font-size:clamp(2.6rem,7vw,4.6rem);
      font-weight: bold;
      letter-spacing:-.025em;
      line-height:1.04;
      margin:1.5rem 0 .8rem;
    }

    .card-header {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .intro {
      color:var(--muted);
      font-size:1.08rem;
    }

    section {
      margin-block-start: 2.5rem;
    }

    .prompt {
      font-size:.9rem;
      color:var(--muted);
      font-weight:bold;
    }

    nav {
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 17.5rem), 1fr));
      gap:1rem;
      margin-block-start:.8rem;
    }

    .card {
      display:flex;
      flex-direction:column;
      padding:1.4rem;
      border:1px solid var(--line);
      border-radius:1.4rem;
      background:var(--card);
      color:inherit;
      transition:transform .2s,box-shadow .2s;
    }

    .card:hover {
      transform:translateY(-.1875rem);
      box-shadow:0 1rem 2rem var(--cardshadow);
    }

    .emoji {
      font-size:2rem;
    }

    h2 {
      font-size:1.25rem;
      font-weight: bold;
    }

    .go {
      padding-block-start:1.4rem;
      color:var(--accent);
      font-weight:500;
    }

    footer {
      margin-block-start:2rem;
      color:var(--muted);
      font-size:.82rem;

      a {
        color: var(--muted);
      }
      a:hover {
        color: oklch( from var(--muted) calc(l - 0.2) c h);
      }
    }

  </style>
</head>
<body>

<main>
  <div class="top">
    <a href="https://dereddingsark.nl">De Reddingsark</a>
  </div>
  
  <h1>Handleidingen<br>De Reddingsark</h1>
  
  <p class="intro">voor beamerdienst, geluid en verlichting.</p>

  <section>
    <p class="prompt">BUNSCHOTEN</p>
    <nav aria-label="Kies een handleiding">
      <a class="card" href="https://beamerbunschoten.docs.dereddingsark.nl">
        <div class="card-header">
          <span class="emoji" aria-hidden="true">🖥️</span>
          <h2>Beamer</h2>
        </div>
        <span class="go">Handleiding openen →</span>
      </a>
      <a class="card" href="https://geluidbunschoten.docs.dereddingsark.nl">
        <div class="card-header">
          <span class="emoji" aria-hidden="true">🔊</span>
          <h2>Geluid</h2>
        </div>
        <span class="go">Handleiding openen →</span>
      </a>
      <a class="card" href="https://lichtbunschoten.docs.dereddingsark.nl">
        <div class="card-header">
          <span class="emoji" aria-hidden="true">💡</span>
          <h2>Licht</h2>
        </div>
        <span class="go">Handleiding openen →</span>
      </a>
    </nav>
  </section>

  <footer><a href="https://dereddingsark.nl/">De Reddingsark</a> · Handleidingen</footer>
</main>

</body>
</html>
